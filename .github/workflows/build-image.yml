name: build-docker-image

on:
  workflow_dispatch:   # 手动点按钮触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t eaglercraftx-server:local .

      - name: Save tar
        run: docker save -o eaglercraftx-server.tar eaglercraftx-server:local

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-tar
          path: eaglercraftx-server.tar
          
